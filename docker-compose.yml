services:
  tikpilot:
    build: .
    image: tikpilot:latest
    container_name: tikpilot
    restart: unless-stopped
    ports:
      # Слева порт на сервере, справа порт внутри контейнера. Внутренний
      # менять незачем, наружу выставляйте любой: "6060:8080"
      - "8080:8080"
    # Все настройки из .env рядом с этим файлом попадают внутрь контейнера.
    # Без этой строки доезжали бы только те, что перечислены ниже поимённо,
    # а их полтора десятка из полусотни: ни ADMIN_NETWORKS, ни LATENCY_TARGETS,
    # ни настроек приёма журнала. Файла может не быть, это не ошибка.
    env_file:
      - path: .env
        required: false

    volumes:
      # Здесь живут база, ключи шифрования и скачанные бэкапы
      - ./data:/data

    # Полсотни постоянных сессий к роутерам, приём журнала, бэкапы и веб.
    # Предел задаёт проект, а не настройки чужого демона Docker: упереться
    # в него означает «Too many open files», а для SQLite ещё и «unable to
    # open database file», то есть панель, которая жива, но молчит. То же
    # самое задано в юните systemd (LimitNOFILE) и в plist для launchd.
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    environment:
      # Каталог данных задаётся здесь и только здесь: значения из этого
      # блока сильнее .env, и путь с сервера не должен утечь внутрь
      # контейнера, где его попросту нет
      DATA_DIR: /data
      # Учётка администратора создаётся только при первом запуске
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      # Ключи: если не задать, будут созданы автоматически в /data
      SECRET_KEY: ${SECRET_KEY:-}
      FERNET_KEY: ${FERNET_KEY:-}
      # Параллелизм опроса устройств и таймауты
      MAX_WORKERS: ${MAX_WORKERS:-12}
      API_TIMEOUT: ${API_TIMEOUT:-10}
      FTP_TIMEOUT: ${FTP_TIMEOUT:-30}
      JOB_RETENTION_DAYS: ${JOB_RETENTION_DAYS:-90}
      # Включите, если ставите за HTTPS-прокси
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
