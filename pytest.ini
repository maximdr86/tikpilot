# Настройки прогона тестов.
#
# Метка slow висит на проверках, которые ждут по-настоящему: ожидание
# устройства после перезагрузки, медленная загрузка пакетов, отложенный
# запуск задачи. Время там не накладные расходы, а предмет проверки,
# ускорить его нельзя, поэтому такие тесты вынесены в отдельную группу.
#
#   pytest -m "not slow"   быстрая проверка, ей пользуются при правках
#   pytest                 всё целиком, перед выпуском и в CI
[pytest]
testpaths = tests
markers =
    slow: ждёт реального времени (перезагрузки, паузы, отложенный запуск)
